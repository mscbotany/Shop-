<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Shop Manage</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
    font-family:Arial,sans-serif;
    background:#f3f5f9;
    color:#222;
}

header{
    background:#1565c0;
    color:white;
    padding:18px;
    text-align:center;
    box-shadow:0 2px 8px #aaa;
}

header h1{font-size:25px}
header p{margin-top:5px;font-size:13px}

.container{
    max-width:600px;
    margin:auto;
    padding:15px;
}

.card{
    background:white;
    border-radius:15px;
    padding:16px;
    margin-bottom:15px;
    box-shadow:0 2px 10px #ddd;
}

.card h2{
    font-size:19px;
    margin-bottom:12px;
}

input,select{
    width:100%;
    padding:13px;
    border:1px solid #ddd;
    border-radius:9px;
    margin-bottom:10px;
    font-size:16px;
}

button{
    border:0;
    border-radius:9px;
    padding:12px 16px;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
}

.addBtn{
    width:100%;
    background:#2e7d32;
    color:white;
}

.product{
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-bottom:1px solid #eee;
    padding:12px 0;
}

.product:last-child{border-bottom:0}

.product-info strong{
    display:block;
    font-size:16px;
}

.product-info small{
    color:#666;
}

.delete{
    background:#e53935;
    color:white;
    padding:8px 11px;
}

.billRow{
    display:flex;
    gap:8px;
    margin-bottom:10px;
}

.billRow select{
    margin:0;
    flex:2;
}

.billRow input{
    margin:0;
    width:80px;
}

.remove{
    background:#e53935;
    color:white;
    padding:8px;
}

.total{
    background:#e8f5e9;
    padding:15px;
    border-radius:10px;
    margin-top:12px;
    font-size:22px;
    font-weight:bold;
    text-align:center;
}

.whatsapp{
    width:100%;
    background:#25D366;
    color:white;
    margin-top:10px;
}

.clear{
    width:100%;
    background:#555;
    color:white;
    margin-top:8px;
}

.empty{
    color:#777;
    text-align:center;
    padding:10px;
}

.stat{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.stat b{
    font-size:25px;
    color:#1565c0;
}
</style>
</head>

<body>

<header>
    <h1>🏪 My Shop</h1>
    <p>Simple Shop Manager</p>
</header>

<div class="container">

<!-- SALES -->
<div class="card">
    <div class="stat">
        <div>
            <small>आज की बिक्री</small>
            <h2>₹<span id="todaySale">0</span></h2>
        </div>
        <div>💰</div>
    </div>
</div>

<!-- ADD PRODUCT -->
<div class="card">
    <h2>➕ Product Add करें</h2>

    <input id="productName"
           type="text"
           placeholder="Product का नाम">

    <input id="productPrice"
           type="number"
           placeholder="Price ₹">

    <input id="productStock"
           type="number"
           placeholder="Stock">

    <button class="addBtn" onclick="addProduct()">
        Add Product
    </button>
</div>

<!-- PRODUCTS -->
<div class="card">
    <h2>📦 Products</h2>
    <div id="productList"></div>
</div>

<!-- BILL -->
<div class="card">
    <h2>🧾 नया Bill</h2>

    <input id="customerName"
           type="text"
           placeholder="Customer का नाम">

    <div id="billItems"></div>

    <button class="addBtn" onclick="addBillItem()">
        + Product जोड़ें
    </button>

    <div class="total">
        Total: ₹<span id="billTotal">0</span>
    </div>

    <button class="whatsapp" onclick="sendWhatsApp()">
        📱 WhatsApp पर Bill भेजें
    </button>

    <button class="clear" onclick="clearBill()">
        🗑️ Bill Clear
    </button>
</div>

</div>

<script>

let products =
    JSON.parse(localStorage.getItem("shopProducts")) || [];

let todaySale =
    Number(localStorage.getItem("todaySale")) || 0;


/* SAVE */

function saveProducts(){
    localStorage.setItem(
        "shopProducts",
        JSON.stringify(products)
    );
}


/* ADD PRODUCT */

function addProduct(){

    const name =
        document.getElementById("productName").value.trim();

    const price =
        Number(document.getElementById("productPrice").value);

    const stock =
        Number(document.getElementById("productStock").value);

    if(!name || price<=0){
        alert("Product name और सही price डालें");
        return;
    }

    products.push({
        id:Date.now(),
        name:name,
        price:price,
        stock:stock || 0
    });

    saveProducts();

    document.getElementById("productName").value="";
    document.getElementById("productPrice").value="";
    document.getElementById("productStock").value="";

    showProducts();
    updateBillSelects();
}


/* SHOW PRODUCTS */

function showProducts(){

    const list =
        document.getElementById("productList");

    if(products.length===0){
        list.innerHTML=
            '<div class="empty">अभी कोई product नहीं है</div>';
        return;
    }

    list.innerHTML="";

    products.forEach(p=>{

        const div=document.createElement("div");

        div.className="product";

        div.innerHTML=`
            <div class="product-info">
                <strong>${p.name}</strong>
                <small>
                    ₹${p.price} • Stock: ${p.stock}
                </small>
            </div>

            <button class="delete"
                onclick="deleteProduct(${p.id})">
                Delete
            </button>
        `;

        list.appendChild(div);
    });
}


/* DELETE */

function deleteProduct(id){

    if(!confirm("Product delete करें?"))
        return;

    products =
        products.filter(p=>p.id!==id);

    saveProducts();

    showProducts();
    updateBillSelects();
}


/* BILL ITEM */

function addBillItem(){

    if(products.length===0){
        alert("पहले Product add करें");
        return;
    }

    const container =
        document.getElementById("billItems");

    const row =
        document.createElement("div");

    row.className="billRow";

    row.innerHTML=`
        <select onchange="calculateBill()">
            ${products.map(p=>
                `<option value="${p.id}">
                    ${p.name} - ₹${p.price}
                </option>`
            ).join("")}
        </select>

        <input type="number"
               value="1"
               min="1"
               onchange="calculateBill()">

        <button class="remove"
                onclick="this.parentElement.remove();calculateBill()">
            ×
        </button>
    `;

    container.appendChild(row);

    calculateBill();
}


/* UPDATE SELECTS */

function updateBillSelects(){

    document
      .querySelectorAll("#billItems select")
      .forEach(select=>{

        const current=select.value;

        select.innerHTML =
            products.map(p=>
                `<option value="${p.id}">
                    ${p.name} - ₹${p.price}
                </option>`
            ).join("");

        select.value=current;
    });

    calculateBill();
}


/* CALCULATE */

function calculateBill(){

    let total=0;

    document
      .querySelectorAll("#billItems .billRow")
      .forEach(row=>{

        const id =
            Number(row.querySelector("select").value);

        const qty =
            Number(row.querySelector("input").value);

        const product =
            products.find(p=>p.id===id);

        if(product)
            total += product.price * qty;
    });

    document.getElementById("billTotal")
        .innerText=total;
}


/* WHATSAPP */

function sendWhatsApp(){

    const customer =
        document.getElementById("customerName")
        .value.trim() || "Customer";

    let message =
        "🏪 *MY SHOP*%0A";

    message +=
        "━━━━━━━━━━━━━━%0A";

    message +=
        "🧾 *Bill*%0A";

    message +=
        "Customer: "+customer+"%0A%0A";

    let total=0;

    document
      .querySelectorAll("#billItems .billRow")
      .forEach(row=>{

        const id =
            Number(row.querySelector("select").value);

        const qty =
            Number(row.querySelector("input").value);

        const product =
            products.find(p=>p.id===id);

        if(product){

            const amount =
                product.price*qty;

            total += amount;

            message +=
                product.name+
                " × "+
                qty+
                " = ₹"+
                amount+
                "%0A";
        }
    });

    if(total===0){
        alert("Bill में product जोड़ें");
        return;
    }

    message +=
        "%0A💰 *TOTAL: ₹"+total+"*";

    todaySale += total;

    localStorage.setItem(
        "todaySale",
        todaySale
    );

    document.getElementById("todaySale")
        .innerText=todaySale;

    window.open(
        "https://wa.me/?text="+message,
        "_blank"
    );
}


/* CLEAR BILL */

function clearBill(){

    document.getElementById("billItems")
        .innerHTML="";

    document.getElementById("customerName")
        .value="";

    calculateBill();
}


/* LOAD */

showProducts();

document.getElementById("todaySale")
    .innerText=todaySale;

</script>

</body>
</html>
